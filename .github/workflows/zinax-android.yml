name: Zinax Stock APK

on:
  push:
    paths:
      - "zinax-stock/**"
      - ".github/workflows/zinax-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zinax-stock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zinax-stock-apk
          path: zinax-stock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
