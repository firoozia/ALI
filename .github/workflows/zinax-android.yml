name: Zinax Stock APK

on:
  push:
    paths:
      - "zinax-stock/**"
      - ".github/workflows/zinax-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: zinax-stock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zinax-stock-apk
          path: zinax-stock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Name the APK
        id: version
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZinaxStock.apk
          echo "code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "name=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/claude/zinax-warehouse-barcode-6sv8m6'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zinax-stock-b${{ github.run_number }}
          name: Zinax Stock ${{ steps.version.outputs.name }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Android APK for Zinax Stock. Download ZinaxStock.apk and install it on the phone.
            versionName: ${{ steps.version.outputs.name }}
            versionCode: ${{ steps.version.outputs.code }}
          files: zinax-stock/ZinaxStock.apk
